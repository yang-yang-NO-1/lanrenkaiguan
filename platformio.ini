; IotMiniBlinker_AllWidgets_WiFiManager_v1_3_online_fix
; ESP8266/ESP32 + WiFiManager + EMQX MQTT + Blinker 风格控件示例
;
; 默认使用 NodeMCU ESP8266。WiFiManager 本地库已放入 lib/WiFiManager。

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = lib
build_flags =
  -I$PROJECT_DIR/include
  -D MQTT_MAX_PACKET_SIZE=2048
  -D IOT_MQTT_BUFFER_SIZE=2048
  -D IOT_JSON_DOC_SIZE=3072
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  knolleary/PubSubClient@^2.8

[env:nodemcuv2]
platform = espressif8266@4.2.0 
board = nodemcuv2
upload_speed = 921600

build_flags = 
custom_export_build_info = yes
extra_scripts = post:scripts/export_versions.py
custom_build_info_section = build_info

[env:esp32dev]
platform = espressif32
board = esp32dev
upload_speed = 921600

